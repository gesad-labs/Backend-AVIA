spring.application.name=avia-api

spring.datasource.url=jdbc:postgresql://localhost:5432/avia
spring.datasource.username=SEU_USUARIO
spring.datasource.password=SUA_SENHA

spring.jpa.hibernate.ddl-auto=update

# Origens permitidas no CORS e no WebSocket, separadas por vírgula. Padrão: qualquer origem.
# Em produção: cors.allowed-origins=https://avia.gesaduece.com.br (ou CORS_ALLOWED_ORIGINS no ambiente)
#cors.allowed-origins=*

# Ambiente exibido na versão (dev, homolog, prod). Em deploy vem da variável APP_ENV.
# A versão (app.version) é gravada no build a partir do arquivo VERSION.
#app.env=dev

# URL do front-end usada nos links dos e-mails. Em produção: app.frontend-url=https://avia.gesaduece.com.br (ou APP_FRONTEND_URL no ambiente)
#app.frontend-url=http://localhost:5173

jwt.secret=SUA_CHAVE_SECRETA
jwt.expiration=86400

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=5000